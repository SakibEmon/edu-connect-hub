<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Edu Connect Hub</title>
  <link rel="stylesheet" href="css/register.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="background-wrapper">
    <div class="background-elements">
      <div class="educational-icon book"></div>
      <div class="educational-icon pencil"></div>
    </div>
    <div class="register-container">
      <div class="logo-box">
        <img src="image/logo.png" alt="Logo" class="logo" />
      </div>
      <h2>Sign Up</h2>
      <form action="php/register.php" method="POST">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role" required>
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
            </select>
          </div>
          <div class="form-group">
            <label for="class">Class</label>
            <select id="class" name="class" required>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>
        </div>
        <div class="form-row" id="subject-password-row">
          <div class="form-group" id="subject-field" style="display: none;">
            <label for="subject">Subject</label>
            <select id="subject" name="subject">
              <option value="Bangla">Bangla</option>
              <option value="English">English</option>
              <option value="Math">Math</option>
              <option value="Physics">Physics</option>
              <option value="Chemistry">Chemistry</option>
              <option value="Biology">Biology</option>
            </select>
          </div>
          <div class="form-group password-wrapper">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
            <span class="toggle-password" id="togglePassword">👁</span>
          </div>
        </div>
        <button type="submit">Sign Up</button>
        <p>Already have an account? <a href="login.html">Log In</a></p>
        <p class="copyright">© All rights reserved by EDU CONNECT HUB.</p>
      </form>
    </div>
  </div>
  <script src="js/register.js"></script>
</body>
</html>
